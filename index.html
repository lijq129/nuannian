<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFF3E7">
  <meta name="build-version" content="dev">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="暖年">
  <meta name="description" content="为胜兰定制的每日健康生活记录与养护参考">
  <meta property="og:type" content="website">
  <meta property="og:title" content="暖年 · 每日养护">
  <meta property="og:description" content="甲状腺术后日常养护小帮手：温和活动跟练、家常菜谱、每日打卡与安全提醒。">
  <meta property="og:image" content="icon-512.png?v=3">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="wechat-share-title" content="暖年 · 每日养护">
  <meta name="wechat-share-desc" content="甲状腺术后日常养护小帮手，陪你慢慢恢复。">
  <title>暖年 · 每日养护</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
  <link rel="icon" href="icon-192.png?v=3" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/design.css">
</head>
<body>
  <main id="app">
    <div id="ptr" class="ptr" aria-hidden="true"><span class="ptr-ico">↻</span><span class="ptr-tx">下拉刷新</span></div>
    <nav id="back-nav" class="back-nav hidden" aria-label="返回导航"><button id="page-back" class="back-button" data-act="back">返回原页面</button></nav>
    <section id="view-home" class="view page" aria-label="今日"><div id="home-body"></div></section>
    <section id="view-diet" class="view page hidden" aria-label="饮食"><div id="diet-body"></div></section>
    <section id="view-move" class="view page hidden" aria-label="活动与养护"><div id="move-body"></div></section>
    <section id="view-me" class="view page hidden" aria-label="我的"><div id="me-body"></div></section>

    <nav class="tabbar" aria-label="主要导航">
      <button class="tab active" data-view="home" aria-label="今日" aria-current="page"><span class="tab-ico" data-ico="home"></span><span class="tab-txt">今日</span></button>
      <button class="tab" data-view="diet" aria-label="饮食"><span class="tab-ico" data-ico="diet"></span><span class="tab-txt">饮食</span></button>
      <button class="tab" data-view="move" aria-label="活动与养护"><span class="tab-ico" data-ico="exercise"></span><span class="tab-txt">活动养护</span></button>
      <button class="tab" data-view="me" aria-label="我的"><span class="tab-ico" data-ico="user"></span><span class="tab-txt">我的</span></button>
    </nav>
  </main>

  <section id="player" class="player hidden" role="dialog" aria-modal="true" aria-label="动作跟练">
    <div class="player-top">
      <button id="p-close" class="pbtn ghost" aria-label="关闭跟练并返回原页面">返回</button>
      <div class="player-progress" aria-label="课程进度"><div id="p-progress" class="player-progress-bar"></div></div>
      <span id="p-count" class="player-count"></span>
    </div>
    <div class="player-stage">
      <div id="p-svg" class="player-svg"></div>
      <h2 id="p-name" class="player-name"></h2>
      <div id="p-timer" class="player-timer" aria-live="off">00:00</div>
      <div id="p-sets" class="player-sets"></div>
      <p id="p-step" class="player-step"></p>
      <p id="p-caution" class="player-caution"></p>
    </div>
    <div class="player-bottom">
      <button id="p-prev" class="pbtn">上一个</button>
      <button id="p-toggle" class="pbtn primary">暂停</button>
      <button id="p-next" class="pbtn">下一个</button>
    </div>
    <button id="p-voice" class="pbtn linkbtn">语音提示：开</button>
  </section>

  <section id="vmodal" class="vmodal hidden" role="dialog" aria-modal="true" aria-label="视频播放">
    <div class="vmodal-top"><button id="vm-close">关闭</button><span id="vm-title" class="vt">视频</span><button id="vm-fs" data-act="vmfs" aria-label="全屏放大" aria-pressed="false">放大</button></div>
    <div id="vm-frame" class="vframe"></div>
    <div class="vmodal-tip">视频为外部平台内容，仅作动作演示参考，不替代专业指导；练习中出现头晕、疼痛或不适请立即停止并咨询医生。</div>
    <a id="vm-open" class="vmodal-open" href="#" target="_blank" rel="noopener noreferrer">在原平台打开</a>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="update-banner" class="update-banner hidden" role="status" aria-live="polite">
    <span class="ub-ico">✨</span>
    <span class="ub-txt">有新版本可用</span>
    <button id="ub-refresh" class="ub-btn" data-act="swrefresh">刷新</button>
    <button id="ub-close" class="ub-x" data-act="swclose" aria-label="忽略更新">×</button>
  </div>

  <script src="js/data-exercise.js"></script>
  <script src="js/data-care.js"></script>
  <script src="js/data-core.js"></script>
  <script src="js/data-diet.js"></script>
  <script src="js/data-recipes-extra.js"></script>
  <script src="js/data-dish.js"></script>
  <script src="js/data-video.js"></script>
  <script src="js/data-fit-video.js"></script>
  <script src="js/recipe-bv.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/gestures.js"></script>
</body>
</html>
